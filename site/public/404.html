<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · quick</title>
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100svh; display: grid; grid-template-rows: 1fr auto; background: #e8e6fd; color: #1a2238; font-family: "Hanken Grotesk", system-ui, sans-serif; padding: 0 clamp(1rem, 2.8vw, 2.5rem) 2.5rem; }
  h1 { margin: 14vh 0 0; font-size: clamp(5rem, 19vw, 19rem); line-height: 0.84; letter-spacing: -0.05em; font-weight: 500; }
  h1 span { display: block; color: #4a3ddb; }
  p { margin: 0; font-size: clamp(1.25rem, 0.9rem + 1.45vw, 1.875rem); justify-self: end; text-align: right; max-width: 30ch; }
  a { color: inherit; text-underline-offset: 0.18em; }
  .l1 { display: block; color: #1a2238; }
  .logo { display: block; width: min(56vw, 46rem); height: auto; margin-bottom: 0.06em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
  <h1><span class="l1">{{logo}}<span class="sr-only">quick</span></span><span>404.</span></h1>
  <p>Nothing here. Try the <a href="/">home page</a> or the <a href="/docs/">docs</a>.</p>
</body>
</html>
