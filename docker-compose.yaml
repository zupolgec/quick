# Stack quick per Coolify in modalità "Raw Docker Compose".
#
# In raw mode Coolify deploya il compose COSÌ COM'È (niente auto-generazione di
# label caddy: niente try_files, niente ingress network forzata) e gira
# `docker compose` standard → le ${VAR} qui sotto le sostituisce dall'env della
# risorsa, anche nelle label. Quindi:
#  - il routing è nelle nostre caddy labels esplicite (corrette per un wildcard
#    reverse-proxy), NON nel campo dominio della UI (lascialo vuoto);
#  - il dominio resta generico via ${QUICK_BASE_DOMAIN} (nessun dominio cablato,
#    nessuna var da mettere nel proxy);
#  - le reti le dichiariamo noi: `quicknet` interna (quick-server <-> oauth2-proxy
#    per service name) e `coolify` esterna (il coolify-proxy raggiunge quick-server).
#
# Due client OAuth Google: CLI (riusa il client Web via QUICK_CLI_CLIENT_ID/SECRET)
# e oauth2-proxy (GOOGLE_CLIENT_ID/SECRET).

services:
  quick-server:
    # Immagine pubblicata a ogni release (multi-arch). Per un deploy riproducibile
    # pinna una versione, es. ghcr.io/zupolgec/quick-server:0.8.1.
    image: ghcr.io/zupolgec/quick-server:latest
    pull_policy: always   # ripulla sempre :latest al deploy (il nodo non riusa l'immagine in cache)
    restart: unless-stopped
    environment:
      QUICK_BASE_DOMAIN: ${QUICK_BASE_DOMAIN}
      QUICK_ALLOWED_DOMAINS: ${QUICK_ALLOWED_DOMAINS}   # uno, lista "a,b", o "*"
      QUICK_OAUTH_CLIENT_ID: ${QUICK_CLI_CLIENT_ID}
      QUICK_OAUTH_CLIENT_SECRET: ${QUICK_CLI_CLIENT_SECRET:-}  # vuoto per client Desktop/PKCE
      QUICK_OAUTH2_URL: http://oauth2-proxy:4180
      # Auto-generato e persistito da Coolify (magic var SERVICE_BASE64_*). Se vuoto
      # quick-server NON parte: nessun default insicuro. Fuori Coolify, valorizzalo a mano.
      QUICK_META_SECRET: ${SERVICE_BASE64_64_QUICKMETA}
      QUICK_OWNERSHIP: ${QUICK_OWNERSHIP:-free}   # free | shared | owned
      QUICK_STORAGE: ${QUICK_STORAGE:-local}
      QUICK_SITES_DIR: /srv/quick
      QUICK_META_DIR: /srv/quick-meta
      QUICK_S3_ENDPOINT: ${QUICK_S3_ENDPOINT:-}
      QUICK_S3_REGION: ${QUICK_S3_REGION:-}
      QUICK_S3_BUCKET: ${QUICK_S3_BUCKET:-}
      QUICK_S3_ACCESS_KEY: ${QUICK_S3_ACCESS_KEY:-}
      QUICK_S3_SECRET_KEY: ${QUICK_S3_SECRET_KEY:-}
      QUICK_S3_PREFIX: ${QUICK_S3_PREFIX:-}
      QUICK_S3_USE_SSL: ${QUICK_S3_USE_SSL:-true}
      # IdP OIDC generico (es. Zitadel): vuoto = Google, come prima. Lo ricevono
      # sia quick-server (verifica degli ID token) che oauth2-proxy (login SSO).
      QUICK_OIDC_ISSUER: ${QUICK_OIDC_ISSUER:-}
    # Routing: label esplicite. Un solo blocco che copre l'APEX (il control plane:
    # API, auth, dashboard) E il wildcard dei siti — quick-server smista per host.
    # ${QUICK_BASE_DOMAIN} lo sostituisce docker compose dall'env della risorsa;
    # {env.CF_API_TOKEN} e {{upstreams}} restano per Caddy. caddy_ingress_network=
    # coolify: rete su cui il proxy raggiunge il container.
    # Forma LISTA (non mappa): i valori con {{...}}/*. restano stringhe e non
    # vengono interpretati come YAML quando Coolify ri-serializza le label.
    labels:
      - "caddy=${QUICK_BASE_DOMAIN}, *.${QUICK_BASE_DOMAIN}"
      - "caddy.tls.dns=cloudflare {env.CF_API_TOKEN}"
      - "caddy.reverse_proxy={{upstreams 8080}}"
      - "caddy_ingress_network=coolify"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      # Solo per QUICK_STORAGE=local; con s3 il container è stateless (rimuovili).
      # QUICK_HOST_DIR separa i dati se sullo stesso host girano più istanze.
      - ${QUICK_HOST_DIR:-/data/coolify/proxy/caddy/data}/quick-sites:/srv/quick
      - ${QUICK_HOST_DIR:-/data/coolify/proxy/caddy/data}/quick-meta:/srv/quick-meta
    networks:
      - quicknet
      - coolify

  oauth2-proxy:
    # Immagine ufficiale (distroless). Niente healthcheck: in compose non farebbe
    # auto-restart e quick-server degrada bene se l'auth è giù; meglio non mettere
    # una shell sul componente di autenticazione solo per un check cosmetico.
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      # Provider SSO: google di default (config effettiva invariata); per un IdP
      # non Google metti QUICK_SSO_PROVIDER=oidc e QUICK_OIDC_ISSUER=https://idp....
      # OAUTH2_PROXY_OIDC_ISSUER_URL vuoto è ignorato dal provider google.
      OAUTH2_PROXY_PROVIDER: ${QUICK_SSO_PROVIDER:-google}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${QUICK_OIDC_ISSUER:-}
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${QUICK_ALLOWED_DOMAINS}
      OAUTH2_PROXY_REDIRECT_URL: https://${QUICK_BASE_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: .${QUICK_BASE_DOMAIN}
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${QUICK_BASE_DOMAIN}
    networks:
      - quicknet

networks:
  quicknet:
  coolify:
    external: true
